spring:
  application:
    name: eaas-identity-service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-for-jwt-signing-that-is-at-least-256-bits-long
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    org.springframework.test: DEBUG
    com.uko.eaas.identity: DEBUG
