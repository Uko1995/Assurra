server:
  port: 8084

# Gateway Configuration (must match gateway's signing secret)
gateway:
  internal:
    signing-secret: ${GATEWAY_SIGNING_SECRET}

# Escrow service integration
escrow:
  service:
    url: ${ESCROW_SERVICE_URL:http://localhost:8082}

spring:
  application:
    name: eaas-communication-service

  # Database Configuration
  datasource:
    url: jdbc:sqlserver://${MSSQL_URL:localhost:1433};databaseName=communication_db;trustServerCertificate=true;encrypt=true
    username: ${MSSQL_USER:sa}
    password: ${MSSQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    open-in-view: false

  # Flyway Configuration - Strict Schema Management
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/repeatable
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false
    create-schemas: true
    ignore-missing-migrations: false
    ignore-ignored-migrations: false
    ignore-future-migrations: false

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eaas_user}
    password: ${RABBITMQ_PASS:eaas_pass}
    virtual-host: /
    listener:
      simple:
        concurrency: 2
        max-concurrency: 10
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3

  # Mail Configuration (SendGrid SMTP)
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY:your-sendgrid-api-key}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Cloudinary Configuration for Evidence Storage
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  secure: true

# Internal Service URLs
identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

# Notification Configuration
notification:
  evidence:
    max-file-size-mb: 10
    expiry-days: 90
  webhook:
    retry-attempts: 5
    retry-delays: 1,5,30,120,1440

# SMS Configuration (Termii)
sms:
  termii:
    api-key: ${TERMII_API_KEY:your-termii-api-key}
    sender-id: EaaS

# Logging
logging:
  level:
    com.uko.eaas.communication: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

info:
  app:
    name: EaaS Communication Service
    version: 1.0.0
    description: Notifications, Disputes, and Evidence Management
