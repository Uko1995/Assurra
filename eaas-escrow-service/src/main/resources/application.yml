server:
  port: 8082

spring:
  application:
    name: eaas-escrow-service

  # Database Configuration
  datasource:
    url: jdbc:sqlserver://${MSSQL_URL:localhost:1433};databaseName=escrow_db;trustServerCertificate=true;encrypt=true
    username: ${MSSQL_USER:sa}
    password: ${MSSQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false

  # Flyway Configuration - Strict Schema Management
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/repeatable
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false
    create-schemas: true
    ignore-missing-migrations: false
    ignore-ignored-migrations: false
    ignore-future-migrations: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:eaas_user}
    password: ${RABBITMQ_PASS:eaas_pass}
    virtual-host: /
    listener:
      simple:
        concurrency: 2
        max-concurrency: 10
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3

# Gateway Configuration (must match gateway's signing secret)
gateway:
  internal:
    signing-secret: ${GATEWAY_SIGNING_SECRET}

# Escrow Configuration
escrow:
  fee:
    percentage: 1.5
    min: 500
    max: 50000
  confirmation:
    window-hours: 72
  auto-release:
    interval-minutes: 5
  payment:
    expiry-hours: 24

# Logging
logging:
  level:
    com.uko.eaas.escrow: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

info:
  app:
    name: EaaS Escrow Service
    version: 1.0.0
    description: Escrow Lifecycle and Workflow Management
